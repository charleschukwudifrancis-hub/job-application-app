services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerdesk
      POSTGRES_PASSWORD: careerdesk-local
      POSTGRES_DB: careerdesk
    ports:
      - "5433:5432"
    volumes:
      - careerdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerdesk -d careerdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerdesk-postgres:

services:
  - type: web
    name: careerdesk
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerdesk-db
          property: connectionString
      - key: APP_SESSION_SECRET
        generateValue: true

databases:
  - name: careerdesk-db
    databaseName: careerdesk
    user: careerdesk
    plan: free
    region: frankfurt
    ipAllowList: []
